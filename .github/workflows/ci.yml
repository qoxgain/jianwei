name: Foundation and sample-data checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Materialize only the regression video
        run: git lfs pull --include="datasets/video_samples/garment_quality/videos/test.mp4" --exclude=""
      - run: python3 scripts/audit_video_samples.py --asset garment_test --output artifacts/sample-integrity.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-encoder.txt -r requirements-browser.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - run: npm ci && npm run build && npm run build:demo
        working-directory: apps/web
      - name: Four scenes, metadata checks, training, sealed evaluation and downloads
        run: .venv/bin/python tests/browser_temporal.py --serve-isolated --chromium "$(command -v google-chrome)" --output artifacts/p032-browser/research
      - name: Original real-video playback
        run: .venv/bin/python tests/browser_video_exploration.py --chromium "$(command -v google-chrome)" --output-dir artifacts/p032-browser/video
      - name: Sampling diagnostics from recorded timestamps, blocked admission and mobile layout
        run: .venv/bin/python tests/browser_sampling.py --chromium "$(command -v google-chrome)" --output artifacts/p034-browser/sampling
      - name: Preregistered protocol, session uncertainty and desktop/mobile research review
        run: .venv/bin/python tests/browser_research_protocol.py --chromium "$(command -v google-chrome)" --output artifacts/p035-browser
      - name: Actual P0.3.6 scalar statistics, all seeds, mobile and local original-video association
        run: .venv/bin/python tests/browser_p036.py --chromium "$(command -v google-chrome)" --output artifacts/p036-browser
      - name: P0.3.7-A generated-media admission and Vite access boundaries on desktop and mobile
        run: .venv/bin/python tests/browser_p037_a.py --chromium "$(command -v google-chrome)" --output artifacts/p037-a-browser
      - name: P0.3.7-A shipped offline evidence and pending user acceptance
        run: .venv/bin/python tests/browser_p037_a_offline.py --chromium "$(command -v google-chrome)" --output artifacts/p037-a-offline
      - name: A.1 reviewed publication, hardlink variants, builds, preview and cache bytes
        run: .venv/bin/python -m tests.check_p037_a1_static --chromium "$(command -v google-chrome)" --output artifacts/p037-a1-static
      - name: A.1 five-state real HTTP interaction on two I/O tokens
        run: .venv/bin/python tests/browser_p037_a1.py --chromium "$(command -v google-chrome)" --output artifacts/p037-a1-browser
      - name: A.1 media-free offline evidence filters and export
        run: .venv/bin/python tests/browser_p037_a1_offline.py --chromium "$(command -v google-chrome)" --output artifacts/p037-a1-offline
      - name: A.2 inert-text optimizer integrity, real HMR and source-map regression
        run: .venv/bin/python -m tests.check_p037_a2_optimizer --chromium "$(command -v google-chrome)" --output artifacts/p037-a2-optimizer
      - name: A.2 offline evidence, accurate pending scope and downloads
        run: .venv/bin/python tests/browser_p037_a2_offline.py --chromium "$(command -v google-chrome)" --output artifacts/p037-a2-offline
      - name: A.3 SQLite evidence, all repeated runs, accurate blocked status and exports
        run: .venv/bin/python tests/browser_p037_a3_offline.py --chromium "$(command -v google-chrome)" --output artifacts/p037-a3-offline
      - name: A.4 isolation, all performance failures, policy limits and exact exports
        run: .venv/bin/python tests/browser_p037_a4_offline.py --chromium "$(command -v google-chrome)" --output artifacts/p037-a4-offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            artifacts/p032-browser/research/*.json
            artifacts/p032-browser/video/*.json
            artifacts/p034-browser/sampling/*.json
            artifacts/p035-browser/*.json
            artifacts/p036-browser/browser-results.json
            artifacts/p037-a-browser/results.json
            artifacts/p037-a-browser/*-http-results.json
            artifacts/p037-a-offline/results.json
            artifacts/p037-a1-static/results.json
            artifacts/p037-a1-browser/results.json
            artifacts/p037-a1-offline/results.json
            artifacts/p037-a2-optimizer/results.json
            artifacts/p037-a2-offline/results.json
            artifacts/p037-a3-offline/results.json
            artifacts/p037-a4-offline/results.json
            artifacts/p031-browser-work/**/api.log
            artifacts/p031-browser-work/**/static.log
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject new private media, high-dimensional features and weight packages
        run: python3 -m scripts.check_public_research_artifacts
      - name: Materialize only the regression video
        run: git lfs pull --include="datasets/video_samples/garment_quality/videos/test.mp4" --exclude=""
      - run: python3 scripts/audit_video_samples.py --asset garment_test --output artifacts/sample-integrity.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils
      - run: python -m pip install -r requirements-encoder.txt
      - run: npm ci
        working-directory: apps/web
      - run: python -m pytest tests -q --junitxml=artifacts/p037-a4-ci/backend-junit.xml
      - name: A.3 generated DELETE/WAL API, concurrent commits, backup and abrupt-exit repetition
        run: python -m scripts.investigate_sqlite_workload --output artifacts/p037-a4-ci/workload --seeds 0 1
      - name: A.4 generated performance instrumentation smoke, not a large-database acceptance result
        run: python -m scripts.benchmark_sqlite_a4 --smoke --output artifacts/p037-a4-ci/performance
      - run: python -m unittest discover -s reference/tests -v
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm run build:demo
        working-directory: apps/web
      - name: Preserve P0.3.6 archive against its original manifest and browser hash
        run: python -m scripts.verify_historical_demo
      - name: Verify A.2 sanitized evidence and pending original-media scope
        run: python -m scripts.package_p037_a2_demo --verify-only
      - name: Verify A.3 SQLite evidence without databases or numerical packages
        run: python -m scripts.package_p037_a3_demo --verify-only
      - name: Verify A.4 generated-data evidence and every failed measurement
        run: python -m scripts.package_p037_a4_demo --verify-only
      - name: Verify A.1 archive integrity and publication boundary
        run: python -m scripts.package_p037_a1_demo --verify-only
      - name: Verify Stage-A archive integrity and publication boundary
        run: python -m scripts.package_p037_a_demo --verify-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a4-sqlite-verification
          path: |
            artifacts/p037-a4-ci/backend-junit.xml
            artifacts/p037-a4-ci/workload/results.json
            artifacts/p037-a4-ci/workload/*.log
            artifacts/p037-a4-ci/workload/*/results.json
            artifacts/p037-a4-ci/workload/*/*.jsonl
            artifacts/p037-a4-ci/performance/results.json
            artifacts/p037-a4-ci/performance/*.log
  pretrained-encoder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize only the regression video
        run: git lfs pull --include="datasets/video_samples/garment_quality/videos/test.mp4" --exclude=""
      - run: python3 scripts/audit_video_samples.py --asset garment_test --output artifacts/sample-integrity.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils
      - run: python -m pip install -r requirements-pretrained.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests/test_pretrained_encoder.py -q --junitxml=artifacts/encoder-junit.xml
      - run: python scripts/export_pretrained_encoder.py --download --report artifacts/encoder-export.json
      - uses: actions/upload-artifact@v4
        with:
          name: official-encoder-verification
          path: |
            artifacts/encoder-export.json
            artifacts/encoder-junit.xml
