openapi: 3.1.0
info:
  title: 见微 V3 P0 核心学习API契约
  version: 3.0.0
  description: This is a specification, not an implemented server.
servers:
- url: /api/v1
paths:
  /learning/ingestions:
    post:
      operationId: post_learning_ingestions
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: &id001
          type: string
          minLength: 1
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Asynchronous job or query result; implementation required
          content:
            application/json:
              schema: &id002
                type: object
                additionalProperties: false
                properties:
                  job_id: *id001
                  status:
                    type: string
                    enum:
                    - PENDING
                    - RUNNING
                    - DONE
                    - FAILED
                    - SKIPPED
                  status_url: *id001
                required:
                - job_id
                - status
                - status_url
        default:
          description: Structured error
          content:
            application/json:
              schema: &id003
                type: object
                additionalProperties: false
                properties:
                  code: *id001
                  message: *id001
                  trace_id: *id001
                required:
                - code
                - message
                - trace_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                asset_ids: &id004
                  type: array
                  items: *id001
                  minItems: 1
                scene_id: *id001
                split:
                  type: string
                  enum:
                  - train
                  - calibration
                  - dev
                  - test
                manifest_id: *id001
              required:
              - asset_ids
              - scene_id
              - split
              - manifest_id
  /learning/jobs:
    post:
      operationId: post_learning_jobs
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Asynchronous job or query result; implementation required
          content:
            application/json:
              schema: *id002
        default:
          description: Structured error
          content:
            application/json:
              schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dataset_version: *id001
                task:
                  type: string
                  enum:
                  - extract
                  - segment
                  - temporal_head
                  - tsm
                  - yolo_detector
                  - evaluate
                config_hash: *id001
              required:
              - dataset_version
              - task
              - config_hash
  /knowledge/validate:
    post:
      operationId: post_knowledge_validate
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      security:
      - bearerAuth: []
      responses:
        default:
          description: Structured error
          content:
            application/json:
              schema: *id003
        '200':
          description: Validation only; no production writes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items: *id001
                  validated_revision:
                    type:
                    - string
                    - 'null'
                  impact_summary:
                    type: object
                required:
                - valid
                - errors
                - validated_revision
                - impact_summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                base_version: *id001
                knowledge:
                  $ref: ../schemas/labels.schema.json
              required:
              - base_version
              - knowledge
  /knowledge/releases:
    post:
      operationId: post_knowledge_releases
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Asynchronous job or query result; implementation required
          content:
            application/json:
              schema: *id002
        default:
          description: Structured error
          content:
            application/json:
              schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                validated_revision: *id001
                base_version: *id001
              required:
              - validated_revision
              - base_version
  /memory/patches:
    post:
      operationId: post_memory_patches
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Asynchronous job or query result; implementation required
          content:
            application/json:
              schema: *id002
        default:
          description: Structured error
          content:
            application/json:
              schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/memory_patch.schema.json
  /observations/{id}/feedback:
    post:
      operationId: post_observations_id_feedback
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Asynchronous job or query result; implementation required
          content:
            application/json:
              schema: *id002
        default:
          description: Structured error
          content:
            application/json:
              schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                decision:
                  type: string
                  enum:
                  - confirm
                  - reject
                  - relabel
                  - unknown
                correct_action_id:
                  type:
                  - string
                  - 'null'
                evidence_ids: *id004
                reason: *id001
              required:
              - decision
              - correct_action_id
              - evidence_ids
              - reason
  /evaluations/compare:
    post:
      operationId: post_evaluations_compare
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Asynchronous job or query result; implementation required
          content:
            application/json:
              schema: *id002
        default:
          description: Structured error
          content:
            application/json:
              schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                candidate_id: *id001
                champion_id: *id001
                dataset_hash: *id001
                protocol_id: *id001
              required:
              - candidate_id
              - champion_id
              - dataset_hash
              - protocol_id
  /models/releases:
    post:
      operationId: post_models_releases
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Asynchronous job or query result; implementation required
          content:
            application/json:
              schema: *id002
        default:
          description: Structured error
          content:
            application/json:
              schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                candidate_id: *id001
                evaluation_id: *id001
                policy_version: *id001
                expected_current_release: *id001
              required:
              - candidate_id
              - evaluation_id
              - policy_version
              - expected_current_release
  /models/rollback:
    post:
      operationId: post_models_rollback
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Asynchronous job or query result; implementation required
          content:
            application/json:
              schema: *id002
        default:
          description: Structured error
          content:
            application/json:
              schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                release_id: *id001
                target_release_id: *id001
                reason: *id001
              required:
              - release_id
              - target_release_id
              - reason
  /jobs/{job_id}:
    get:
      operationId: get_jobs_job_id
      parameters:
      - name: job_id
        in: path
        required: true
        schema: *id001
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Asynchronous job or query result; implementation required
          content:
            application/json:
              schema:
                type: object
        default:
          description: Structured error
          content:
            application/json:
              schema: *id003
  /memory/snapshots/{version}:
    get:
      operationId: get_memory_snapshots_version
      parameters:
      - name: version
        in: path
        required: true
        schema: *id001
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Asynchronous job or query result; implementation required
          content:
            application/json:
              schema:
                type: object
        default:
          description: Structured error
          content:
            application/json:
              schema: *id003
  /predictions:
    get:
      operationId: get_predictions
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Asynchronous job or query result; implementation required
          content:
            application/json:
              schema:
                type: object
        default:
          description: Structured error
          content:
            application/json:
              schema: *id003
  /learning/clusters:
    get:
      operationId: get_learning_clusters
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Asynchronous job or query result; implementation required
          content:
            application/json:
              schema:
                type: object
        default:
          description: Structured error
          content:
            application/json:
              schema: *id003
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
