components:
  schemas:
    ClockAnchor:
      properties:
        domain_index:
          type: integer
          minimum: 0.0
          title: Domain Index
        pts_ms:
          type: integer
          minimum: 0.0
          title: Pts Ms
        capture_utc:
          type: string
          title: Capture Utc
      additionalProperties: false
      type: object
      required:
      - domain_index
      - pts_ms
      - capture_utc
      title: ClockAnchor
    EvaluationRequest:
      properties:
        model_run_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$
          title: Model Run Id
        import_ids:
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$
          type: array
          maxItems: 100
          minItems: 1
          title: Import Ids
        sealed_test:
          type: boolean
          const: true
          title: Sealed Test
      additionalProperties: false
      type: object
      required:
      - model_run_id
      - import_ids
      - sealed_test
      title: EvaluationRequest
    FeatureSpace:
      properties:
        contract_version:
          type: string
          const: '3.1'
          title: Contract Version
        encoder_sha:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Encoder Sha
        preprocessing_sha:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Preprocessing Sha
        sampling_sha:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Sampling Sha
        roi_policy_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Roi Policy Hash
        pooling:
          type: string
          minLength: 1
          title: Pooling
        dimension:
          type: integer
          minimum: 1.0
          title: Dimension
      additionalProperties: false
      type: object
      required:
      - contract_version
      - encoder_sha
      - preprocessing_sha
      - sampling_sha
      - roi_policy_hash
      - pooling
      - dimension
      title: FeatureSpace
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImportEpisode:
      properties:
        episode_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$
          title: Episode Id
        domain_index:
          type: integer
          minimum: 0.0
          title: Domain Index
        start_ms:
          type: integer
          minimum: 0.0
          title: Start Ms
        end_ms:
          type: integer
          exclusiveMinimum: 0.0
          title: End Ms
      additionalProperties: false
      type: object
      required:
      - episode_id
      - domain_index
      - start_ms
      - end_ms
      title: ImportEpisode
    ImportRequest:
      properties:
        upload_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$
          title: Upload Id
        format:
          type: string
          enum:
          - mp4
          - npz
          title: Format
        source_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$
          title: Source Id
        data_origin:
          type: string
          enum:
          - real_video
          - synthetic_features
          title: Data Origin
        source_upload_id:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$
          - type: 'null'
          title: Source Upload Id
        source_domain_map:
          anyOf:
          - items:
              type: integer
              minimum: 0.0
            type: array
            maxItems: 10000
          - type: 'null'
          title: Source Domain Map
        encoder_artifact_id:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$
          - type: 'null'
          title: Encoder Artifact Id
        declared_source_hash:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
          title: Declared Source Hash
        feature_space:
          anyOf:
          - $ref: '#/components/schemas/FeatureSpace'
          - type: 'null'
        requested_split:
          type: string
          enum:
          - unassigned
          - train
          - calibration
          - test
          title: Requested Split
          default: unassigned
        context:
          patternProperties:
            ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$:
              anyOf:
              - type: string
              - type: integer
              - type: number
              - type: boolean
              - type: 'null'
          type: object
          title: Context
        episodes:
          items:
            $ref: '#/components/schemas/ImportEpisode'
          type: array
          maxItems: 10000
          title: Episodes
        episode_origin:
          anyOf:
          - type: string
            enum:
            - manual
            - external
          - type: 'null'
          title: Episode Origin
        clock_anchors:
          items:
            $ref: '#/components/schemas/ClockAnchor'
          type: array
          maxItems: 10000
          title: Clock Anchors
      additionalProperties: false
      type: object
      required:
      - upload_id
      - format
      - source_id
      - data_origin
      title: ImportRequest
    PreviewRequest:
      properties:
        yaml:
          type: string
          maxLength: 262144
          minLength: 1
          title: Yaml
      additionalProperties: false
      type: object
      required:
      - yaml
      title: PreviewRequest
    ProfileRequest:
      properties:
        profile:
          type: string
          maxLength: 64
          minLength: 1
          title: Profile
      additionalProperties: false
      type: object
      required:
      - profile
      title: ProfileRequest
    TrainRequest:
      properties:
        import_ids:
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$
          type: array
          maxItems: 100
          minItems: 3
          title: Import Ids
      additionalProperties: false
      type: object
      required:
      - import_ids
      title: TrainRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VersionRequest:
      properties:
        yaml:
          type: string
          maxLength: 262144
          minLength: 1
          title: Yaml
        base_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Base Hash
      additionalProperties: false
      type: object
      required:
      - yaml
      - base_hash
      title: VersionRequest
