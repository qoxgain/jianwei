openapi: 3.1.0
info:
  title: 见微 P0.1.1 通用场景知识服务
  version: 0.1.1
paths:
  /api/health:
    get:
      summary: Health
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/scenes:
    get:
      summary: Scenes
      operationId: scenes_api_scenes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/scenes/{scene_id}:
    get:
      summary: Scene Bootstrap
      operationId: scene_bootstrap_api_scenes__scene_id__get
      parameters:
      - name: scene_id
        in: path
        required: true
        schema:
          type: string
          title: Scene Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/bootstrap:
    get:
      summary: Bootstrap
      description: Compatibility alias, always resolves to the configured default
        scene.
      operationId: bootstrap_api_bootstrap_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      deprecated: true
  /api/config/validate:
    post:
      summary: Validate Configuration
      operationId: validate_configuration_api_config_validate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/scenes/{scene_id}/knowledge/preview:
    post:
      summary: Scene Preview
      operationId: scene_preview_api_scenes__scene_id__knowledge_preview_post
      parameters:
      - name: scene_id
        in: path
        required: true
        schema:
          type: string
          title: Scene Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/scenes/{scene_id}/knowledge/versions:
    get:
      summary: Scene Versions
      operationId: scene_versions_api_scenes__scene_id__knowledge_versions_get
      parameters:
      - name: scene_id
        in: path
        required: true
        schema:
          type: string
          title: Scene Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Scene Save
      operationId: scene_save_api_scenes__scene_id__knowledge_versions_post
      parameters:
      - name: scene_id
        in: path
        required: true
        schema:
          type: string
          title: Scene Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/scenes/{scene_id}/knowledge/versions/{version_id}:
    get:
      summary: Scene Version Details
      operationId: scene_version_details_api_scenes__scene_id__knowledge_versions__version_id__get
      parameters:
      - name: scene_id
        in: path
        required: true
        schema:
          type: string
          title: Scene Id
      - name: version_id
        in: path
        required: true
        schema:
          type: string
          title: Version Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/scenes/{scene_id}/audit:
    get:
      summary: Scene Audit
      operationId: scene_audit_api_scenes__scene_id__audit_get
      parameters:
      - name: scene_id
        in: path
        required: true
        schema:
          type: string
          title: Scene Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/knowledge/preview:
    post:
      summary: Preview Knowledge
      operationId: preview_knowledge_api_knowledge_preview_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
  /api/knowledge/versions:
    get:
      summary: List Versions
      operationId: list_versions_api_knowledge_versions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      deprecated: true
    post:
      summary: Save Version
      operationId: save_version_api_knowledge_versions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
  /api/knowledge/versions/{version_id}:
    get:
      summary: Version Details
      operationId: version_details_api_knowledge_versions__version_id__get
      deprecated: true
      parameters:
      - name: version_id
        in: path
        required: true
        schema:
          type: string
          title: Version Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/audit:
    get:
      summary: Audit History
      operationId: audit_history_api_audit_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      deprecated: true
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PreviewRequest:
      properties:
        yaml:
          type: string
          maxLength: 262144
          minLength: 1
          title: Yaml
      additionalProperties: false
      type: object
      required:
      - yaml
      title: PreviewRequest
    ProfileRequest:
      properties:
        profile:
          type: string
          maxLength: 64
          minLength: 1
          title: Profile
      additionalProperties: false
      type: object
      required:
      - profile
      title: ProfileRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VersionRequest:
      properties:
        yaml:
          type: string
          maxLength: 262144
          minLength: 1
          title: Yaml
        base_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Base Hash
      additionalProperties: false
      type: object
      required:
      - yaml
      - base_hash
      title: VersionRequest
